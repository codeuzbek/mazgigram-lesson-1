<!DOCTYPE html>
<!-- Coding By CodingNepal - codingnepalweb.com -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login & Registration Form</title>
    <!---Custom CSS File--->
    <link rel="stylesheet" href="css/login.css">
    <script src="js/login.js"></script>
</head>
<body>
<div class="container">
    <input type="checkbox" id="check">
    <div class="login form">
        <header>Login</header>
        <div>
            <input type="text" id="login-email" placeholder="Enter your email" value="bigman@gmail.com">
            <input type="password" id="login-password" placeholder="Enter your password" value="123456">
            <a href="#">Forgot password?</a>
            <input type="button" onclick="login()" class="button" value="Login">
        </div>
        <div class="signup">
        <span class="signup">Don't have an account?
         <label for="check">Signup</label>
        </span>
        </div>
    </div>
    <div class="registration form">
        <header>Signup</header>
        <div>
            <input type="text" id="reg-name" placeholder="Enter your name">
            <input type="text" id="reg-surname" placeholder="Enter your surname">
            <input type="text" id="reg-email" placeholder="Enter your email">
            <input type="password" id="reg-password" placeholder="Create a password">
            <input type="password" id="reg-confirm-password" placeholder="Confirm your password">
            <input type="button" onclick="registration()" class="button" value="Signup">
        </div>
        <div class="signup">
        <span class="signup">Already have an account?
         <label for="check">Login</label>
        </span>
        </div>
    </div>
</div>
</body>
</html>
