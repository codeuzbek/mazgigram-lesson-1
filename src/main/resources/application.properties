spring.application.name=mazgigram.chat-initial

##############################
#         SERVER
##############################
server.port=8080
server.domain=http://localhost:${server.port}
##############################
#         DATABASE
##############################
spring.datasource.url=jdbc:postgresql://localhost:5432/mazgigram-db
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
##############################
#         Attach
##############################
attach.upload.folder=images/
attach.upload.url=http://localhost:${server.port}/api/v1/attach
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
##############################
#         EMAIL
##############################
spring.mail.host=smtp.mail.ru
spring.mail.port=465
spring.mail.username=jumaniyazov.bobur@mail.ru
spring.mail.password=take_your_password
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=50000
spring.mail.properties.mail.smtp.timeout=50000
spring.mail.properties.mail.smtp.writetimeout=50000
##############################
#         FLYWAY
##############################
spring.flyway.baselineOnMigrate=false
spring.flyway.baselineVersion=0
spring.flyway.enabled=false
##############################
#         LOGGIN
##############################
logging.level.root=INFO
logging.level.api.giybat.uz=DEBUG
logging.pattern.console=%date{dd MM yyyy;HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %green(%msg%n)
# Loglar yoziladigan fayl nomi va joylashuvi
logging.file.name=logs/app.log
# Log formatini faylda sozlash
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
# Maksimal fayl o'lchami, yangi fayl yaratish uchun (10MB o'lchamda rotate qiladi)
logging.file.max-size=1MB
logging.pattern.rolling-file-name=app-%d{yyyy-MM-dd}.%i.log
logging.file.path=logs/

